<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffc93c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Aprende a dibujar animales paso a paso">
  <title>¡A dibujar!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Iconos -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5 L3.5 12 L10 19 M4 12 H20.5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 L12 3.5 L21 11.5 M5.5 9.5 V20.5 H10 V14.5 H14 V20.5 H18.5 V9.5"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
      <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4.5"/><circle class="dot" cx="8" cy="8" r="1.6"/><circle class="dot" cx="16" cy="8" r="1.6"/><circle class="dot" cx="12" cy="12" r="1.6"/><circle class="dot" cx="8" cy="16" r="1.6"/><circle class="dot" cx="16" cy="16" r="1.6"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 4.5 L7.5 12 L15 19.5"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 4.5 L16.5 12 L9 19.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 L10 18 L19.5 6.5"/></symbol>
      <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4.5 12 A7.5 7.5 0 1 0 7 6.4 M4 3.5 V8 H8.5"/></symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20 L5.2 15 L16 4.2 A2.5 2.5 0 0 1 19.8 8 L9 18.8 Z M14 6.2 L17.8 10 M4 20 L9 18.8"/></symbol>
    </defs>
  </svg>

  <!-- ============ INICIO ============ -->
  <section id="screen-home" class="screen" data-screen="home">
    <div class="lang" role="group" data-i18n-label="language">
      <button class="lang-btn" data-lang="es" lang="es">ES</button>
      <button class="lang-btn" data-lang="eu" lang="eu">EU</button>
      <button class="lang-btn" data-lang="en" lang="en">EN</button>
    </div>
    <div class="home-hero">
      <div class="stickers" aria-hidden="true">
        <div class="sticker s1" data-art="cat"></div>
        <div class="sticker s2" data-art="giraffe"></div>
        <div class="sticker s3" data-art="bee"></div>
      </div>
      <h1 class="home-title"><svg class="title-icon"><use href="#i-pencil"/></svg><span data-i18n="title">¡A dibujar!</span></h1>
    </div>
    <div class="home-actions">
      <button class="big-btn btn-choose" data-action="gallery">
        <svg class="big-icon"><use href="#i-grid"/></svg>
        <span data-i18n="choose">Elegir dibujo</span>
      </button>
      <button class="big-btn btn-random" data-action="random">
        <svg class="big-icon"><use href="#i-dice"/></svg>
        <span data-i18n="random">¡Sorpresa!</span>
      </button>
    </div>
  </section>

  <!-- ============ GALERÍA ============ -->
  <section id="screen-gallery" class="screen" data-screen="gallery">
    <header class="bar">
      <button class="icon-btn" data-action="back" data-i18n-label="back"><svg><use href="#i-back"/></svg></button>
      <h2 class="bar-title" data-i18n="chooseTitle">¿Qué quieres dibujar?</h2>
      <button class="icon-btn btn-random-sm" data-action="random" data-i18n-label="random"><svg><use href="#i-dice"/></svg></button>
    </header>
    <div class="scroller">
      <ul class="cards" id="cards"></ul>
    </div>
  </section>

  <!-- ============ PASOS ============ -->
  <section id="screen-draw" class="screen" data-screen="draw">
    <header class="bar">
      <button class="icon-btn" data-action="back" data-i18n-label="back"><svg><use href="#i-back"/></svg></button>
      <div class="progress">
        <div class="progress-name" id="draw-name"></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="goal" id="goal" data-i18n-title="goal"></div>
    </header>
    <main class="stage">
      <button class="nav-btn prev" data-action="prev" data-i18n-label="prev"><svg><use href="#i-prev"/></svg></button>
      <div class="paper" id="paper">
        <div class="step-badge"><span id="step-num">1</span><small id="step-total">/6</small></div>
        <div class="paper-art" id="paper-art"></div>
      </div>
      <button class="nav-btn next" data-action="next" data-i18n-label="next"><svg class="ic-next"><use href="#i-next"/></svg><svg class="ic-check"><use href="#i-check"/></svg></button>
    </main>
  </section>

  <!-- ============ TERMINADO ============ -->
  <section id="screen-done" class="screen" data-screen="done">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="done-main">
      <h2 class="done-title" data-i18n="doneTitle">¡Muy bien!</h2>
      <div class="paper done-paper"><div class="paper-art" id="done-art"></div></div>
      <p class="done-sub"><svg><use href="#i-pencil"/></svg><span data-i18n="doneSub">¡Ahora coloréalo!</span></p>
    </div>
    <div class="done-actions">
      <button class="act-btn act-again" data-action="again"><svg><use href="#i-replay"/></svg><span data-i18n="again">Otra vez</span></button>
      <button class="act-btn act-random" data-action="random"><svg><use href="#i-dice"/></svg><span data-i18n="random">¡Sorpresa!</span></button>
      <button class="act-btn act-another" data-action="another"><svg><use href="#i-grid"/></svg><span data-i18n="another">Otro dibujo</span></button>
      <button class="act-btn act-home" data-action="home"><svg><use href="#i-home"/></svg><span data-i18n="home">Inicio</span></button>
    </div>
  </section>

  <script src="js/i18n.js"></script>
  <script src="js/drawings.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
