<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba en dispositivos</title>
<style>
  body { margin: 0; padding: 16px; background: #3a3646; font-family: system-ui, sans-serif; color: #fff; }
  .row { display: flex; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0 16px 16px 0; }
  figcaption { font-size: 13px; margin-bottom: 4px; opacity: .8; }
  iframe { border: 0; background: #fff; border-radius: 12px; display: block; transform-origin: 0 0; }
  .wrap { overflow: hidden; border-radius: 12px; }
</style>
</head>
<body>
<!-- Uso: tools/devices.html?r=draw/giraffe/3  (ruta de la app sin "#/"); &tv=1 fuerza modo TV en todos -->
<div class="row" id="row"></div>
<script>
  var q = new URLSearchParams(location.search), route = q.get('r') || '', only = q.get('only');
  var devices = [
    { name: 'Móvil 390×844', w: 390, h: 844, s: 0.75 },
    { name: 'Móvil horizontal 844×390', w: 844, h: 390, s: 0.75 },
    { name: 'Tablet 820×1180', w: 820, h: 1180, s: 0.55 },
    { name: 'Tablet horizontal 1180×820', w: 1180, h: 820, s: 0.55 },
    { name: 'TV LG 1920×1080', w: 1920, h: 1080, s: 0.5, tv: true }
  ];
  var html = '';
  devices.forEach(function (d, i) {
    if (only && only.split(',').indexOf(String(i)) < 0) return;
    var src = '../index.html' + (d.tv || q.get('tv') ? '?tv=1' : '') + '#/' + route;
    html += '<figure><figcaption>' + d.name + '</figcaption><div class="wrap" style="width:' + d.w * d.s + 'px;height:' + d.h * d.s + 'px">' +
      '<iframe src="' + src + '" width="' + d.w + '" height="' + d.h + '" style="transform:scale(' + d.s + ')"></iframe></div></figure>';
  });
  document.getElementById('row').innerHTML = html;
</script>
</body>
</html>
