<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Previsualización de dibujos</title>
<link rel="stylesheet" href="../css/art.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; background: #eee; }
  .row { display: flex; align-items: center; margin-bottom: 8px; }
  .row h3 { width: 110px; margin: 0; font-size: 14px; }
  .cell { width: 170px; height: 170px; background: #fff; margin-right: 6px; border-radius: 8px; padding: 4px; box-sizing: border-box; position: relative; }
  .cell span { position: absolute; left: 6px; top: 2px; font-size: 11px; color: #888; }
  .cell.final { outline: 3px solid #ff3d81; }
</style>
</head>
<body>
<div id="out"></div>
<script src="../js/drawings.js"></script>
<script src="../js/art.js"></script>
<script>
  // ?from=0&to=6 para paginar, o ?ids=dog,cat para ver solo algunos (&size=300 para verlos más grandes)
  var q = new URLSearchParams(location.search), from = +(q.get('from') || 0), to = +(q.get('to') || 99);
  var ids = q.get('ids') ? q.get('ids').split(',') : null;
  if (q.get('size')) document.head.insertAdjacentHTML('beforeend', '<style>.cell{width:' + q.get('size') + 'px;height:' + q.get('size') + 'px}</style>');
  var list = ids ? DRAWINGS.filter(function (d) { return ids.indexOf(d.id) >= 0; }) : DRAWINGS.slice(from, to);
  var html = '';
  list.forEach(function (d) {
    html += '<div class="row"><h3>' + d.name.es + ' (' + d.steps.length + ')</h3>';
    d.steps.forEach(function (_, i) { html += '<div class="cell"><span>' + (i + 1) + '</span>' + Art.render(d, i, 'steps') + '</div>'; });
    html += '<div class="cell final">' + Art.render(d, 99, 'final') + '</div></div>';
  });
  document.getElementById('out').innerHTML = html;
</script>
</body>
</html>
